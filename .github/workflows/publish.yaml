name: Sign and publish UPM package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PACKAGE_DIR: Packages/com.github.asus4.texture-source
  DIST_DIR: dist

jobs:
  publish:
    name: Sign and publish
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Read package metadata
        run: |
          package_name="$(jq -r '.name' "$PACKAGE_DIR/package.json")"
          package_version="$(jq -r '.version' "$PACKAGE_DIR/package.json")"

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

          printf 'Package name: %s\n' "$package_name"
          printf 'Package version: %s\n' "$package_version"

      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o "$RUNNER_TEMP/upm-install.sh"
          bash "$RUNNER_TEMP/upm-install.sh"
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Verify Unity UPM CLI
        run: upm --version

      - name: Sign package
        run: |
          mkdir -p "$DIST_DIR"
          upm pack "$PACKAGE_DIR" --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Verify signed package
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed package archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          tar -tzf "$archive" | grep -qx 'package/package.json'
          tar -tzf "$archive" | grep -qx 'package/.attestation.p7m'

          echo "PACKAGE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          printf 'Archive: %s\n' "$(basename "$archive")"
          tar -xOzf "$archive" package/package.json | jq '{name, version}'

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tgz
            dist/*.tar.gz

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish "$PACKAGE_ARCHIVE" --access public --provenance --tag latest
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Dry run npm publish
        if: github.event_name == 'workflow_dispatch'
        run: npm publish "$PACKAGE_ARCHIVE" --access public --provenance --tag latest --dry-run
        env:
          NPM_CONFIG_PROVENANCE: true
